spring:
  application:
    name: property-service

  datasource:
    url: jdbc:postgresql://localhost:5432/property_db
    username: property_user
    password: property_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoint:
    web:
      exposure:
        include: health,info